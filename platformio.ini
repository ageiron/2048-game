; 2048-game — PlatformIO project configuration
; Target: Guition JC4880P443C_I_W (ESP32-P4 + ESP32-C6, 4.3" MIPI-DSI 480x800)
;
; Platform: pioarduino/platform-espressif32 (supports ESP32-P4 + arduino-esp32 3.x)
; Framework: ESP-IDF via pioarduino
;
; ESP-IDF is installed automatically by PlatformIO on first build (~1 GB download).
; Requires Python Scripts in PATH, e.g.:
;   C:\Users\<you>\AppData\Local\Programs\Python\Python313\Scripts

[platformio]
default_envs = esp32p4

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = espidf

; Flash: 16MB DIO (configured in sdkconfig.defaults)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; PSRAM: 32MB Octal (configured in sdkconfig.defaults)
board_build.arduino.memory_type = qio_opi

build_flags =
    -I src
    -I include

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; CHANGE ME: set to this device's COM port
upload_port = COM6
monitor_port = COM6

; PlatformIO defaults to 0x10000 for the app, but partitions.csv puts the
; factory app at 0x20000. Override with an explicit esptool command that
; writes all three images at the correct offsets. See docs/BRINGUP.md.
;
; Uses system Python esptool because the PlatformIO-bundled esptool.py venv
; is missing the rich_click dependency (see docs/BRINGUP.md — "esptool venv").
; CHANGE ME: point at your system esptool.exe (install via
;   <python>\python.exe -m pip install esptool)
upload_command =
    C:/Users/Antonio/AppData/Local/Programs/Python/Python313/Scripts/esptool.exe
    --chip esp32p4
    --port $UPLOAD_PORT
    --baud $UPLOAD_SPEED
    --before default-reset
    --after hard-reset
    write-flash -z
    --flash-mode dio
    --flash-freq 80m
    --flash-size detect
    0x2000  ${BUILD_DIR}/bootloader.bin
    0x8000  ${BUILD_DIR}/partitions.bin
    0x20000 ${BUILD_DIR}/firmware.bin

; IDF component dependencies are in src/idf_component.yml
; sdkconfig options are in sdkconfig.defaults

[env:esp32p4_arduino]
; Alternative: Arduino framework via pioarduino + arduino-esp32 3.x.
; Use the vendor arduino_examples as reference if you have the vendor SDK
; package (JC4880P443C_I_W/1-Demo/arduino_examples/ — not included in this
; template, see docs/BRINGUP.md for where to get it).
; NOTE: ESP-HOSTED WiFi (C6 co-processor) may require extra setup with Arduino.
; The espidf env above is the proven path for this board.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl @ ^8.4.0
